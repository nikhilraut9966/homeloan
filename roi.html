<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compact ROI Calculator</title>
  <style>
    :root{font-family:Inter,system-ui,Arial;color:#111}
    body{max-width:900px;margin:14px auto;padding:12px}
    h1{font-size:20px;margin:6px 0}
    form{display:block}
    .app-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .app-row input[type=text], .app-row input[type=date], .app-row input[type=number], .app-row select{padding:6px;border:1px solid #ccc;border-radius:6px}
    .app-row label{font-size:12px;margin-right:6px;white-space:nowrap}
    .app-row .age{min-width:120px;font-size:13px;color:#333}
    .compact-grid{display:flex;gap:8px;flex-wrap:wrap}
    .compact-grid > div{flex:1 1 220px}
    .small{font-size:13px;color:#444}
    .controls{display:flex;gap:8px;margin-top:8px}
    button{padding:8px 10px;border-radius:6px;border:0;background:#0b76d1;color:#fff;cursor:pointer}
    .summary{margin-top:10px;padding:10px;border-radius:8px;background:#f5f7fb;font-size:14px}
    .muted{font-size:13px;color:#666}
    .inline-options{display:flex;gap:12px;align-items:center;margin-top:8px}
    .inline-options label{display:flex;align-items:center;gap:6px}
  </style>
</head>
<body>
  <h1>Compact ROI Calculator</h1>
  <p class="muted">Applicants on one line each. Project & loan auto-calculates.</p>

  <form id="form" onsubmit="event.preventDefault();calc();">

    <div>
      <!-- Applicants: each row single line -->
      <div class="small" style="margin-bottom:6px">Applicants</div>

      <div id="apps">
        <!-- template rows generated by JS -->
      </div>
    </div>

    <hr style="margin:12px 0" />

    <div class="compact-grid">
      <div>
        <label class="small">Agreement Value</label>
        <input id="agreement" type="number" step="0.01" min="0" placeholder="0" />
      </div>

      <div>
        <label class="small">GST</label>
        <input id="gst" type="number" step="0.01" min="0" placeholder="0" />
      </div>

      <div>
        <label class="small">Project Cost (A+GST)</label>
        <input id="projectCost" type="number" readonly />
      </div>

      <div>
        <label class="small">80% of Project</label>
        <input id="pc80" type="number" readonly />
      </div>

      <div>
        <label class="small">90% of Project</label>
        <input id="pc90" type="number" readonly />
      </div>

      <div>
        <label class="small">Loan Amount</label>
        <input id="loanAmount" type="number" step="0.01" min="0" placeholder="0" />
      </div>
    </div>

    <div class="inline-options">
      <label><input type="checkbox" id="maxSaving" /> Max Saving</label>
      <label><input type="checkbox" id="cre" /> CRE</label>
      <label><input type="checkbox" id="fullDisp" /> Full Disbursement</label>
      <label><input type="checkbox" id="bt" /> BT</label>
      <label><input type="checkbox" id="gcli" /> GCLI (Insurance)</label>
    </div>

    <div class="controls">
      <button type="button" onclick="calc()">Calculate ROI</button>
      <button type="button" onclick="resetForm()" style="background:#666">Reset</button>
    </div>

    <div id="summary" class="summary muted">Fill values and click <strong>Calculate ROI</strong>.</div>
  </form>

  <script>
    // create 4 applicant rows compactly
    const appsContainer = document.getElementById('apps');
    for(let i=0;i<4;i++){
      const div = document.createElement('div');
      div.className = 'app-row';
      div.innerHTML = `
        <label>Name</label><input type="text" id="name${i}" placeholder="Name" />
        <label>DOB</label><input type="date" id="dob${i}" />
        <label>Gender</label><select id="gender${i}"><option value="M">M</option><option value="F">F</option><option value="O">O</option></select>
        <label>CIBIL</label><input type="number" id="cibil${i}" min="-1" max="900" style="width:90px" placeholder="e.g.750" />
        <div class="age" id="age${i}">Age: --</div>
      `;
      appsContainer.appendChild(div);
    }

    // helpers
    function parseDateLocal(s){ if(!s) return null; const d = new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
    function ageFromDOB(dob){ if(!dob) return null; const now = new Date(); let y = now.getFullYear()-dob.getFullYear(); let m = now.getMonth()-dob.getMonth(); let d = now.getDate()-dob.getDate(); if(d<0){ m-=1; const prev = new Date(now.getFullYear(), now.getMonth(), 0); d += prev.getDate(); } if(m<0){ y-=1; m += 12; } return {y,m,d}; }
    function fmtAge(a){ if(!a) return 'Age: --'; return `Age: ${a.y}y ${a.m}m ${a.d}d`; }

    function updateAges(){
      for(let i=0;i<4;i++){
        const dobStr = document.getElementById('dob'+i).value;
        const d = parseDateLocal(dobStr);
        const a = d?ageFromDOB(d):null;
        document.getElementById('age'+i).textContent = fmtAge(a);
      }
    }

    // Project calculations
    function updateProject(){
      const agreement = parseFloat(document.getElementById('agreement').value) || 0;
      const gst = parseFloat(document.getElementById('gst').value) || 0;
      const project = agreement + gst;
      document.getElementById('projectCost').value = project?project.toFixed(2):'';
      document.getElementById('pc80').value = project? (project*0.8).toFixed(2):'';
      document.getElementById('pc90').value = project? (project*0.9).toFixed(2):'';
    }

    // wire events
    ['agreement','gst','loanAmount'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.addEventListener('input', updateProject); } });
    for(let i=0;i<4;i++){ ['dob'+i,'name'+i,'gender'+i,'cibil'+i].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('change', updateAges); if(el) el.addEventListener('input', updateAges); }); }

    function calc(){
      updateAges(); updateProject();
      // collect CIBILs
      const cibilVals = [];
      for(let i=0;i<4;i++){ const raw = document.getElementById('cibil'+i).value; if(raw!==""){ const v = parseFloat(raw); if(!isNaN(v)) cibilVals.push(v); } }

      const anyBelow300 = cibilVals.some(v=>v<300);
      const anyLE750 = cibilVals.some(v=>v<=750);
      const anyIsMinusOne = cibilVals.some(v=>v===-1);
      const cibilForAvg = cibilVals.filter(v=>v>=300);
      let avgCibil = null; if(cibilForAvg.length) avgCibil = cibilForAvg.reduce((a,b)=>a+b,0)/cibilForAvg.length;

      // Determine base ROI
      let baseROI;
      if(avgCibil===null){
        if(anyBelow300) baseROI = 7.80; else baseROI = 9.00;
      } else {
        if(avgCibil >= 825) baseROI = 7.25;
        else if(avgCibil >= 751) baseROI = 7.45;
        else if(avgCibil >= 701) baseROI = 7.60;
        else if(avgCibil >= 300) baseROI = 9.00;
        else baseROI = 9.00;
      }

      // additions
      const loanAmount = parseFloat(document.getElementById('loanAmount').value) || 0;
      const maxSaving = document.getElementById('maxSaving').checked;
      const cre = document.getElementById('cre').checked;
      let additional = 0; let maxApplied = false;
      if(maxSaving && loanAmount > 7500000){ additional += 0.25; maxApplied = true; }
      if(cre) additional += 0.25;
      let roiAfterAdd = baseROI + additional;

      // concessions
      const fullDisp = document.getElementById('fullDisp').checked;
      const bt = document.getElementById('bt').checked;
      const gcli = document.getElementById('gcli').checked;

      // check ages and women
      let anyBelow40=false; let anyWoman=false;
      for(let i=0;i<4;i++){ const dob = parseDateLocal(document.getElementById('dob'+i).value); const gender = document.getElementById('gender'+i).value; const a = dob?ageFromDOB(dob):null; if(a && a.y < 40) anyBelow40=true; if(gender==='F') anyWoman=true; }

      // concession applicability updated per user: applicable if any CIBIL <=750 or any CIBIL == -1, OR if maxSavingApplied or cre
      const concessionApplicable = (maxApplied || cre || anyLE750 || anyIsMinusOne);

      let concession = 0;
      if(concessionApplicable){ if(anyBelow40) concession += 0.10; if(fullDisp) concession += 0.10; if(bt) concession += 0.10; if(anyWoman) concession += 0.05; if(concession>0.10) concession = 0.10; }

      let roiAfterCon = roiAfterAdd - concession;

      const projectCost = parseFloat(document.getElementById('projectCost').value) || 0;
      if(projectCost>0 && loanAmount > projectCost*0.8){ roiAfterCon += 0.10; }

      if(gcli){ roiAfterCon -= 0.05; }

      const finalROI = parseFloat(roiAfterCon.toFixed(3));

      // build summary compact
      const parts = [];
      parts.push(`<strong>Base ROI</strong>: ${baseROI.toFixed(2)}% ${avgCibil?`(Avg CIBIL ${avgCibil.toFixed(1)})`: anyBelow300? '(Some <300)':''}`);
      if(additional>0) parts.push(`<strong>Additional</strong>: +${additional.toFixed(2)}%`);
      parts.push(`<strong>After Add</strong>: ${roiAfterAdd.toFixed(3)}%`);
      parts.push(`<strong>Concession</strong>: -${concession.toFixed(2)}% ${concessionApplicable? '(applied)':''}`);
      if(projectCost>0 && loanAmount > projectCost*0.8) parts.push(`<strong>High LTV</strong>: +0.10% (Loan &gt;80% Project)`);
      if(gcli) parts.push(`<strong>GCLI concession</strong>: -0.05%`);
      parts.push(`<h2 style="margin:8px 0 0">Final ROI: ${finalROI}%</h2>`);

      // extra diagnostics
      parts.push(`<div class="muted">Loan: ${loanAmount.toLocaleString()} | Project: ${projectCost.toLocaleString()} | 80%: ${(projectCost*0.8).toFixed(2)}</div>`);

      // show which options selected
      const opts = [];
      if(maxSaving) opts.push('Max Saving');
      if(cre) opts.push('CRE');
      if(fullDisp) opts.push('Full Disbursement');
      if(bt) opts.push('BT');
      if(gcli) opts.push('GCLI');
      if(opts.length) parts.push(`<div class="muted">Selected: ${opts.join(', ')}</div>`);

      // show CIBIL raw values
      if(cibilVals.length) parts.push(`<div class="muted">CIBILs: ${cibilVals.join(', ')}</div>`);

      document.getElementById('summary').innerHTML = parts.join('<br/>');
    }

    function resetForm(){ document.getElementById('form').reset(); updateAges(); updateProject(); document.getElementById('summary').innerHTML = 'Fill values and click <strong>Calculate ROI</strong>.'; }

    // init
    updateAges(); updateProject();
  </script>
</body>
</html>
